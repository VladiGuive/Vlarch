# Hide non-launcher / utility .desktop entries from Walker.
blacklist = [
  "^avahi-",
  "^bssh$",
  "^bvnc$",
  "^cmake-gui$",
  "^xgps$",
  "^xgpsspeed$",
  # AUR wrapper; microsoft-edge.desktop launches via vlarch-edge.
  "^microsoft-edge-stable$",
  # Qt dev tools / utilities (not daily launchers).
  "^qt",
  "^org\\.qt",
  "^qdbus",
]
