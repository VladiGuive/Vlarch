monitor=,preferred,auto,auto

$terminal = kitty -e tmux
exec-once = vlarch-keyring-unlock
exec-once = vlarch-portal-start
exec-once = vlarch-workspace --init
exec-once = hyprpaper
exec-once = waybar
exec-once = vlarch-hyprpm-sync
exec-once = vlarch-walker-services
exec-once = vlarch-ensure-hermes
exec-once = vlarch-hermes-dashboard
exec-once = xwaylandvideobridge

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = GTK_THEME,Nordic
env = GTK2_RC_FILES,$HOME/.gtkrc-2.0
env = QT_QPA_PLATFORMTHEME,gtk2

source = nord-colors.conf

general {
    gaps_in = 5
    gaps_out = 10

    border_size = 1

    resize_on_border = false

    allow_tearing = false

    layout = dwindle
}

decoration {
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
    }

    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

animations {
    enabled = true

    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}

dwindle {
    preserve_split = true # You probably want this
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = false
}
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    scroll_method = 2fg

    touchpad {
        natural_scroll = false
        scroll_factor = 1.0
        disable_while_typing = true
        tap-to-click = true
        clickfinger_behavior = true
    }
}

$mainMod = SUPER
# Keybind reference menu: keep in sync with ~/.config/elephant/menus/keybinds.lua

bindd = $mainMod, SPACE, Open application launcher, exec, vlarch-walker
bindd = $mainMod, K, Open keybind reference, exec, vlarch-walker -m menus:keybinds -p "Keybinds..."
bindd = $mainMod, RETURN, Open terminal, exec, $terminal
bindd = $mainMod, Q, Close focused window, killactive,
bindd = $mainMod, V, Toggle floating on focused window, togglefloating,
# Client fullscreen inside the tiled window (video/tab); avoids Wayland Edge presentation mode
bindd = $mainMod, F, Fullscreen content inside tile, fullscreen, 0
# Move focus with mainMod + arrow keys
bindd = $mainMod, left, Move focus left, movefocus, l
bindd = $mainMod, right, Move focus right, movefocus, r
bindd = $mainMod, up, Move focus up, movefocus, u
bindd = $mainMod, down, Move focus down, movefocus, d
# Switch workspaces 1–10 on focused monitor's block (10 per screen, left-to-right)
bindd = $mainMod, 1, Switch to workspace 1, exec, vlarch-workspace goto 1
bindd = $mainMod, 2, Switch to workspace 2, exec, vlarch-workspace goto 2
bindd = $mainMod, 3, Switch to workspace 3, exec, vlarch-workspace goto 3
bindd = $mainMod, 4, Switch to workspace 4, exec, vlarch-workspace goto 4
bindd = $mainMod, 5, Switch to workspace 5, exec, vlarch-workspace goto 5
bindd = $mainMod, 6, Switch to workspace 6, exec, vlarch-workspace goto 6
bindd = $mainMod, 7, Switch to workspace 7, exec, vlarch-workspace goto 7
bindd = $mainMod, 8, Switch to workspace 8, exec, vlarch-workspace goto 8
bindd = $mainMod, 9, Switch to workspace 9, exec, vlarch-workspace goto 9
bindd = $mainMod, 0, Switch to workspace 10, exec, vlarch-workspace goto 10

# Cycle workspaces within focused monitor's block (not on Waybar)
bindd = $mainMod, mouse_down, Next workspace on monitor, exec, vlarch-workspace next
bindd = $mainMod, mouse_up, Previous workspace on monitor, exec, vlarch-workspace prev

# Move active window to a workspace on focused monitor's block
bindd = $mainMod SHIFT, 1, Move window to workspace 1, exec, vlarch-workspace move 1
bindd = $mainMod SHIFT, 2, Move window to workspace 2, exec, vlarch-workspace move 2
bindd = $mainMod SHIFT, 3, Move window to workspace 3, exec, vlarch-workspace move 3
bindd = $mainMod SHIFT, 4, Move window to workspace 4, exec, vlarch-workspace move 4
bindd = $mainMod SHIFT, 5, Move window to workspace 5, exec, vlarch-workspace move 5
bindd = $mainMod SHIFT, 6, Move window to workspace 6, exec, vlarch-workspace move 6
bindd = $mainMod SHIFT, 7, Move window to workspace 7, exec, vlarch-workspace move 7
bindd = $mainMod SHIFT, 8, Move window to workspace 8, exec, vlarch-workspace move 8
bindd = $mainMod SHIFT, 9, Move window to workspace 9, exec, vlarch-workspace move 9
bindd = $mainMod SHIFT, 0, Move window to workspace 10, exec, vlarch-workspace move 10

# Move/resize windows with mainMod + LMB/RMB and dragging
binddm = $mainMod, mouse:272, Move window by dragging, movewindow
binddm = $mainMod, mouse:273, Resize window by dragging, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Screenshots (grim + slurp + wl-clipboard)
bindd = $mainMod SHIFT, S, Screenshot region to clipboard, exec, bash -c 'area=$(slurp) || exit 0; grim -g "$area" - | wl-copy'
bindd = SHIFT, Print, Screenshot all screens to clipboard, exec, grim - | wl-copy
bindd = $mainMod, S, Screenshot region to file, exec, bash -c 'area=$(slurp) || exit 0; dir="$HOME/Pictures/Screenshots"; mkdir -p "$dir"; grim -g "$area" "$dir/$(date +%Y_%m_%d_%H_%M_%S).png"'
bindd = , Print, Screenshot all screens to file, exec, bash -c 'dir="$HOME/Pictures/Screenshots"; mkdir -p "$dir"; grim "$dir/$(date +%Y_%m_%d_%H_%M_%S).png"'

layerrule {
    name = walker-blur
    match:namespace = ^walker$

    blur = on
    ignore_alpha = 0.85
    no_anim = on
}

windowrule {
    name = walker-fallback
    match:title = ^Walker$

    float = on
    center = on
}

windowrule {
    name = xwayland-video-bridge
    match:class = ^(xwaylandvideobridge|XwaylandVideoBridge)$

    no_initial_focus = on
    no_focus = on
    no_anim = on
    no_blur = on
    max_size = 1 1
    opacity = 0.0
}

windowrule {
    name = vlarch-update-kitty
    match:title = ^(vlarch update)$

    workspace = current
    float = on
    center = on
    size = 500 220
    min_size = 500 220
    max_size = 500 220
    rounding = 0
}

windowrule {
    name = vlarch-agent-kitty
    match:title = ^vlarch-agent$

    workspace = current
    float = on
    center = on
    size = 600 570
    min_size = 600 570
    max_size = 600 570
}
