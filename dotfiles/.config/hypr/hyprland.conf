monitor=,preferred,auto,auto

$terminal = kitty -e tmux
exec-once = vlarch-keyring-unlock
exec-once = vlarch-portal-start
exec-once = vlarch-workspace --init
exec-once = hyprpaper
exec-once = waybar
exec-once = vlarch-hyprpm-sync
exec-once = vlarch-walker-services

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = GTK_THEME,Nordic
env = GTK2_RC_FILES,$HOME/.gtkrc-2.0
env = QT_QPA_PLATFORMTHEME,gtk2

general {
    gaps_in = 5
    gaps_out = 10

    border_size = 1

    col.active_border = rgba(88c0d0ee) rgba(81a1c1ee) 45deg
    col.inactive_border = rgba(4c566acc)

    resize_on_border = false

    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 0

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(2e3440ee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

animations {
    enabled = true

    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}

dwindle {
    preserve_split = true # You probably want this
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = false
}
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    scroll_method = 2fg

    touchpad {
        natural_scroll = false
        scroll_factor = 1.0
        disable_while_typing = true
        tap-to-click = true
        clickfinger_behavior = true
    }
}

$mainMod = SUPER

bind = $mainMod, SPACE, exec, walker
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, V, togglefloating,
# Client fullscreen inside the tiled window (video/tab); avoids Wayland Edge presentation mode
bind = $mainMod, F, fullscreenstate, 0 2
# Fill tile/monitor but keep browser UI (tabs, toolbar)
bind = $mainMod SHIFT, F, fullscreenstate, 2 0
# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
# Switch workspaces 1–10 on focused monitor's block (10 per screen, left-to-right)
bind = $mainMod, 1, exec, vlarch-workspace goto 1
bind = $mainMod, 2, exec, vlarch-workspace goto 2
bind = $mainMod, 3, exec, vlarch-workspace goto 3
bind = $mainMod, 4, exec, vlarch-workspace goto 4
bind = $mainMod, 5, exec, vlarch-workspace goto 5
bind = $mainMod, 6, exec, vlarch-workspace goto 6
bind = $mainMod, 7, exec, vlarch-workspace goto 7
bind = $mainMod, 8, exec, vlarch-workspace goto 8
bind = $mainMod, 9, exec, vlarch-workspace goto 9
bind = $mainMod, 0, exec, vlarch-workspace goto 10

# Cycle workspaces within focused monitor's block (not on Waybar)
bind = $mainMod, mouse_down, exec, vlarch-workspace next
bind = $mainMod, mouse_up, exec, vlarch-workspace prev

# Move active window to a workspace on focused monitor's block
bind = $mainMod SHIFT, 1, exec, vlarch-workspace move 1
bind = $mainMod SHIFT, 2, exec, vlarch-workspace move 2
bind = $mainMod SHIFT, 3, exec, vlarch-workspace move 3
bind = $mainMod SHIFT, 4, exec, vlarch-workspace move 4
bind = $mainMod SHIFT, 5, exec, vlarch-workspace move 5
bind = $mainMod SHIFT, 6, exec, vlarch-workspace move 6
bind = $mainMod SHIFT, 7, exec, vlarch-workspace move 7
bind = $mainMod SHIFT, 8, exec, vlarch-workspace move 8
bind = $mainMod SHIFT, 9, exec, vlarch-workspace move 9
bind = $mainMod SHIFT, 0, exec, vlarch-workspace move 10

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Screenshots (grim + slurp + wl-clipboard)
bind = $mainMod SHIFT, S, exec, bash -c 'area=$(slurp) || exit 0; grim -g "$area" - | wl-copy'
bind = , Print, exec, grim - | wl-copy

layerrule {
    name = walker-blur
    match:namespace = ^walker$

    blur = on
    ignore_alpha = 0.85
}

windowrule {
    name = microsoft-edge
    match:class = ^(msedge|Microsoft-edge|microsoft-edge)$

    blur = off
}

windowrule {
    name = vlarch-update-kitty
    match:title = ^(vlarch update)$

    float = on
    center = on
    size = 550 270
    min_size = 550 270
    max_size = 550 270
    rounding = 0
}
