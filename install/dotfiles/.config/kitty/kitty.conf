# Vlarch kitty config.

font_family JetBrainsMono Nerd Font
font_size 12.0

cursor_shape beam
cursor_blink_interval 0.5
scrollback_lines 20000

enable_audio_bell no
window_padding_width 8
hide_window_decorations yes
confirm_os_window_close 0

# Gruvbox-ish dark palette.
foreground #ebdbb2
background #1d2021
selection_foreground #1d2021
selection_background #d5c4a1

color0  #282828
color1  #cc241d
color2  #98971a
color3  #d79921
color4  #458588
color5  #b16286
color6  #689d6a
color7  #a89984
color8  #928374
color9  #fb4934
color10 #b8bb26
color11 #fabd2f
color12 #83a598
color13 #d3869b
color14 #8ec07c
color15 #ebdbb2
